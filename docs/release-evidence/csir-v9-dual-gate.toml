# This is a pending template, not a tagged release or a green CI record.
# `--template` checks that it makes no completion claim. Actual measured
# evidence belongs in a separate retained bundle validated with `--tagged`.
# The historical v8 record remains unchanged and independently meaningful.
evidence_version = 1
model_version = 9
certificate_schema = 9
phase = "dual-gate-integration"
state = "pending"
retirement_eligible = false
unresolved_risks = ["SR-013", "SR-017"]
repository = "pending"
tag = "pending"
commit = "pending"
lean_toolchain = "leanprover/lean4:v4.32.0-rc1"
rust_toolchain = "pending"

[mandatory_gates]
semantic_v9 = true
historical_v8 = true
obligations_v6 = true
rust_taint = true
rust_ownership = true
z3_air_capability = true

# The release reviewer must approve a concrete memory budget separately;
# the validator checks the measured peak against it, not its suitability.
[limits]
peak_memory_bytes = "pending"

[results]
corpus_total = "pending"
accepted_corpus_regressions = "pending"
unexplained_disagreements = "pending"
approved_policy_rejections = "pending"
median_verifier_ms = "pending"
p95_verifier_ms = "pending"
initialization_ms = "pending"
peak_memory_bytes = "pending"
million_record_count = "pending"
selfhost_trio_seconds = "pending"

