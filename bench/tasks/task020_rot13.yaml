id: task020_rot13
source_path: tools/task020_rot13.sigil
difficulty: intermediate
description: |
  Write a Sigil tool that applies ROT13 to its input. ASCII uppercase letters
  (A-Z, byte values 65-90) and ASCII lowercase letters (a-z, byte values
  97-122) are each rotated by 13 positions within their case. Every other
  byte (digits, punctuation, whitespace, non-ASCII) passes through unchanged.

  The output buffer has the same length as the input. The tool exports
  `pub fn tool_main(input_ptr: i64, input_len: i64) -> i64 ! { Alloc }`
  and returns the packed (out_ptr * 4294967296 + input_len) of an
  alloc()-allocated buffer.
signature: "pub fn tool_main(input_ptr: i64, input_len: i64) -> i64 ! { Alloc }"
required_attrs: []
required_effects: ["Alloc"]
required_grants: {}
fuel_budget: 100000
inputs:
  - name: empty
    value: ""
  - name: lowercase
    value: hello
  - name: mixed_case
    value: Hello, World!
  - name: passthrough
    value: "12345 -+*/"
  - name: full_alphabet
    value: abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ
expected_output_strategy: capture_from_reference
