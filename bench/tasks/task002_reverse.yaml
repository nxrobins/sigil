id: task002_reverse
source_path: tools/task002_reverse.sigil
difficulty: basic
description: |
  Write a Sigil tool that returns its input bytes in reverse order (last
  byte first). Empty input yields empty output. Read `input_len` bytes at
  `input_ptr`, allocate an output buffer, write the reversed bytes, and
  return the packed `(out_ptr * 4294967296 + len)`.
signature: "pub fn tool_main(input_ptr: i64, input_len: i64) -> i64 ! { Alloc }"
required_attrs: []
required_effects: ["Alloc"]
required_grants: {}
fuel_budget: 200000
inputs:
  - name: empty
    value: ""
  - name: abc
    value: abc
  - name: palindrome
    value: racecar
  - name: phrase
    value: "Hello, World!"
expected_output_strategy: capture_from_reference
