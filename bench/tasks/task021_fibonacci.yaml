id: task021_fibonacci
source_path: tools/task021_fibonacci.sigil
difficulty: intermediate
description: |
  Write a Sigil tool that parses its input as a decimal integer n and
  returns the n-th Fibonacci number as an ASCII-decimal string. Use the
  convention fib(0) = 0, fib(1) = 1, fib(n) = fib(n-1) + fib(n-2). For
  example input "10" returns "55". Return the packed
  `(out_ptr * 4294967296 + len)` of the decimal-string buffer.
signature: "pub fn tool_main(input_ptr: i64, input_len: i64) -> i64 ! { Alloc }"
required_attrs: []
required_effects: ["Alloc"]
required_grants: {}
fuel_budget: 300000
inputs:
  - name: zero
    value: "0"
  - name: one
    value: "1"
  - name: ten
    value: "10"
  - name: twenty
    value: "20"
  - name: thirty
    value: "30"
expected_output_strategy: capture_from_reference
