id: task121_secret_rot13
source_path: tools/task121_secret_rot13.sigil
difficulty: intermediate
description: |
  The input is @Secret-tainted. Write a Sigil tool that applies ROT13 to it:
  ASCII letters (A-Z, a-z) rotate 13 positions within their case; all other
  bytes pass through unchanged.

  This is the SAME algorithm as the public ROT13 task, but the input is
  @Secret and runs in tool mode (no declassification), so the result MUST
  remain @Secret: declare
  `tool_main(input_ptr: i64 @Secret, input_len: i64 @Secret) -> i64 @Secret`
  and keep the output buffer and all derived locals `@Secret`. The taint
  checker rejects any flow that drops the label. Return the packed
  `(out_ptr * 4294967296 + len)`.
signature: "pub fn tool_main(input_ptr: i64 @Secret, input_len: i64 @Secret) -> i64 @Secret ! { Alloc }"
required_attrs: []
required_effects: ["Alloc"]
required_grants: {}
fuel_budget: 200000
inputs:
  - name: empty
    value: ""
  - name: lowercase
    value: hello
  - name: mixed_case
    value: "Hello, World!"
  - name: full_alphabet
    value: abcdefghijklmnopqrstuvwxyz
expected_output_strategy: capture_from_reference
