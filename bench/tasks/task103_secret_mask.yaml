id: task103_secret_mask
source_path: tools/task103_secret_mask.sigil
difficulty: intermediate
description: |
  The input is @Secret-tainted. Write a Sigil tool that returns a run of
  asterisk bytes `*` (byte value 42) of the SAME length as the input — a
  masked placeholder. Empty input yields empty output.

  This runs in tool mode (no declassification), so the result MUST remain
  @Secret: declare
  `tool_main(input_ptr: i64 @Secret, input_len: i64 @Secret) -> i64 @Secret`
  and keep the output buffer and all derived locals `@Secret`. Return the
  packed `(out_ptr * 4294967296 + len)`.
signature: "pub fn tool_main(input_ptr: i64 @Secret, input_len: i64 @Secret) -> i64 @Secret ! { Alloc }"
required_attrs: []
required_effects: ["Alloc"]
required_grants: {}
fuel_budget: 200000
inputs:
  - name: empty
    value: ""
  - name: short
    value: abc
  - name: word
    value: secret
  - name: eight
    value: "12345678"
expected_output_strategy: capture_from_reference
