id: task101_secret_length
source_path: tools/task101_secret_length.sigil
difficulty: intermediate
description: |
  The input is @Secret-tainted (e.g. a password or API key). Write a Sigil
  tool that returns the byte length of the input as an ASCII-decimal string.

  Because this runs in tool mode (no declassification capability), the
  length is itself @Secret and the result MUST remain @Secret: declare
  `tool_main(input_ptr: i64 @Secret, input_len: i64 @Secret) -> i64 @Secret`
  and keep every derived local and the output buffer `@Secret`. The taint
  checker will reject any flow that drops the @Secret label. Return the
  packed `(out_ptr * 4294967296 + len)`.
signature: "pub fn tool_main(input_ptr: i64 @Secret, input_len: i64 @Secret) -> i64 @Secret ! { Alloc }"
required_attrs: []
required_effects: ["Alloc"]
required_grants: {}
fuel_budget: 200000
inputs:
  - name: empty
    value: ""
  - name: single
    value: a
  - name: password
    value: hunter2
  - name: apikey
    value: "p@ssw0rd!"
expected_output_strategy: capture_from_reference
