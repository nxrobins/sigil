id: task032_sha256_hex
source_path: tools/task032_sha256_hex.sigil
difficulty: ffi_fs
description: |
  Compute the SHA-256 of the input bytes and return the result as
  lowercase hex (64 ASCII chars).

  Required imports:
      use sigil::crypto;

  Then:
      let digest = crypto::sha256(input_ptr, input_len);
      // unpack digest pointer/len, then:
      let hex = crypto::hex_encode(digest_ptr, digest_len);

  Both `crypto::sha256` and `crypto::hex_encode` are deterministic.
  No grants required (pure compute).

  This task uses FFI-backed crypto (sha256), so the tool MUST declare
  `#[ring(outer)] #[trusted]` per R004.
signature: "pub fn tool_main(input_ptr: i32, input_len: i32) -> i64 ! { Alloc, FFI, Unsafe }"
required_attrs: ["#[ring(outer)]", "#[trusted]"]
required_effects: ["Alloc", "FFI", "Unsafe"]
required_grants: {}
fuel_budget: 200000
inputs:
  - name: empty
    value: ""
  - name: hello
    value: "hello"
  - name: longer
    value: "the quick brown fox jumps over the lazy dog"
expected_output_strategy: capture_from_reference
stdlib_imports: ["crypto"]
