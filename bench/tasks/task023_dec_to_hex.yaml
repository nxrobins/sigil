id: task023_dec_to_hex
source_path: tools/task023_dec_to_hex.sigil
difficulty: basic
description: |
  Write a Sigil tool that parses its input as a decimal integer and returns
  that value as LOWERCASE hexadecimal with no `0x` prefix and no leading
  zeros (the value 0 renders as "0"). For example "255" returns "ff" and
  "4096" returns "1000". Return the packed `(out_ptr * 4294967296 + len)`
  of the hex-string buffer.
signature: "pub fn tool_main(input_ptr: i64, input_len: i64) -> i64 ! { Alloc }"
required_attrs: []
required_effects: ["Alloc"]
required_grants: {}
fuel_budget: 200000
inputs:
  - name: zero
    value: "0"
  - name: sixteen
    value: "16"
  - name: two_fifty_five
    value: "255"
  - name: four_thousand
    value: "4096"
expected_output_strategy: capture_from_reference
