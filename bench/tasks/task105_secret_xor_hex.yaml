id: task105_secret_xor_hex
source_path: tools/task105_secret_xor_hex.sigil
difficulty: intermediate
description: |
  The input is @Secret-tainted. Write a Sigil tool that XOR-folds all input
  bytes together into a single checksum byte (running XOR starting from 0)
  and returns that byte as exactly two LOWERCASE hex digits. Empty input
  yields "00". SIGIL has no `^` operator — compute XOR bit by bit.

  This runs in tool mode (no declassification), so the checksum is @Secret
  and the result MUST remain @Secret: declare
  `tool_main(input_ptr: i64 @Secret, input_len: i64 @Secret) -> i64 @Secret`
  and keep every derived local and the output buffer `@Secret`. Return the
  packed `(out_ptr * 4294967296 + len)`.
signature: "pub fn tool_main(input_ptr: i64 @Secret, input_len: i64 @Secret) -> i64 @Secret ! { Alloc }"
required_attrs: []
required_effects: ["Alloc"]
required_grants: {}
fuel_budget: 200000
inputs:
  - name: empty
    value: ""
  - name: single
    value: A
  - name: word
    value: hello
  - name: alnum
    value: test123
expected_output_strategy: capture_from_reference
