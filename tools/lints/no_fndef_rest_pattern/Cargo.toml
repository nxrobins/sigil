[package]
name = "no_fndef_rest_pattern"
version = "0.1.0"
edition = "2024"
publish = false

# Wall 4 Step 7 spec-compliance follow-up: Rust+syn-based source-tree
# lint enforcing N22-S7. Replaces the regex approach (rejected per
# NF-S7-7 — regex is fundamentally wrong for Rust's nested-brace
# syntax). NOT a workspace member (kept standalone to avoid feature
# unification with sigil-compiler).

[dependencies]
syn = { version = "2", features = ["full", "visit"] }
walkdir = "2"

[dev-dependencies]
tempfile = "3"

[[bin]]
name = "no_fndef_rest_pattern"
path = "src/main.rs"

[workspace]
